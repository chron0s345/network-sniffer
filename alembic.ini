# Alembic-Konfiguration für die Entwicklung (z. B. `uv run alembic revision --autogenerate -m "..."`).
# Die Datenbank-URL wird aus den Settings (NS_DATA_DIR) abgeleitet; zur Laufzeit wendet die Anwendung
# die Migrationen beim Start selbst an (network_sniffer.storage.db.run_migrations).
[alembic]
script_location = %(here)s/src/network_sniffer/migrations
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
