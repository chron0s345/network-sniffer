[project]
name = "network-sniffer"
version = "0.0.0"
description = "Defensive Data-Leak-Erkennung im Netzwerkverkehr des eigenen Windows-PCs"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "time-machine>=2.14",
]

[project.scripts]
network-sniffer = "network_sniffer.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_sniffer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert ist das pytest-Idiom (S101); Nicht-Loopback-Adressen wie 0.0.0.0 sind
# bewusste Testdaten für den Loopback-Guard (S104).
"tests/**" = ["S101", "S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: Tests, die nur unter Windows laufen (CI-Job windows-build)",
]

[tool.coverage.run]
source = ["network_sniffer"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ['if __name__ == "__main__":']
