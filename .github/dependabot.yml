version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Neue Versionen erst nach einer Karenzzeit übernehmen (Schutz vor kompromittierten Releases).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # Python-Abhängigkeiten (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Neue Versionen erst nach einer Karenzzeit übernehmen (Schutz vor kompromittierten Releases).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
