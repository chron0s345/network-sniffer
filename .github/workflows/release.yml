name: release

on:
  push:
    branches: [main]

# Minimal auf Workflow-Ebene; Schreibrechte nur in den Jobs, die sie brauchen.
permissions:
  contents: read

jobs:
  # Erzeugt/aktualisiert den Release-PR (Version + CHANGELOG aus Conventional Commits)
  # und legt nach dessen Merge Tag und GitHub-Release an.
  # uv.lock wird per extra-files (release-please-config.json) mit angehoben, sonst schlägt
  # `uv sync --locked` im Release-PR und im Paket-Build fehl.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Mit GITHUB_TOKEN erstellte PRs lösen keine Checks aus -> Auto-Merge hinge. Daher PAT bevorzugen.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # KAN-46 (AC3): Windows-Paket aus dem Release-Tag bauen, Smoke-Test gegen die Tag-Version und
  # Zip + .sha256 als Release-Assets anhängen, dazu Build-Provenance (Sigstore über GitHub-OIDC).
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: write      # gh release upload
      id-token: write      # OIDC für die Provenance-Signatur
      attestations: write  # Attestation speichern
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Release-Version aus dem Tag ableiten
        id: version
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-+]+)?)$') {
            throw "Unerwartetes Tag-Format: '$env:RELEASE_TAG' (erwartet v<SemVer>)"
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: uv und Python 3.12 einrichten
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
          # Kein Cache im Release-Build: keine Wiederverwendung von Zuständen aus PR-Läufen.
          enable-cache: false

      - name: Abhängigkeiten installieren
        run: uv sync --locked --all-extras

      # Lizenz-Allowlist, PyInstaller, Bundle- und Versionsprüfung (Abgleich pyproject/uv.lock/EXE), Zip + .sha256.
      - name: Windows-Paket bauen
        run: uv run python packaging/build_windows.py

      - name: Paketpfad ermitteln
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = Join-Path (Resolve-Path dist) "network-sniffer-$env:VERSION-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Paket für Version $env:VERSION fehlt: $zip" }
          if (-not (Test-Path -LiteralPath "$zip.sha256")) { throw "Prüfsummendatei fehlt: $zip.sha256" }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Smoke-Test gegen die Release-Version
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke_test.ps1 -ZipPath "$env:ZIP_PATH" -ExpectedVersion "$env:VERSION"

      - name: Build-Provenance attestieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      # Ohne --clobber: veröffentlichte Assets werden nie stillschweigend durch einen anderen Build ersetzt.
      - name: Zip und Prüfsumme an das Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: gh release upload "$env:RELEASE_TAG" "$env:ZIP_PATH" "$env:ZIP_PATH.sha256" --repo "$env:GITHUB_REPOSITORY"
