name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # Required Check: PR-Titel wird zur Squash-Commit-Message und steuert SemVer + CHANGELOG.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Jira-Key als Scope
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^chore(\(.+\))?!?: '; then exit 0; fi
          if ! echo "$TITLE" | grep -Eq '^[a-z]+\([A-Z][A-Z0-9]+-[0-9]+\)!?: .+'; then
            echo "::error::PR-Titel muss 'typ(JIRA-123): beschreibung' sein (ohne Ticket nur 'chore: ...')."
            exit 1
          fi
