name: windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-Name wird nach KAN-11 zusätzlicher Required Check der Branch-Protection – nicht umbenennen.
  # Gleiche Schritte wie `build-test` (ci.yml), aber auf Windows (Zielplattform): prüft Windows-Pfade,
  # Zeilenenden, Zeitzonen und die Tests mit @pytest.mark.windows. Läuft in PowerShell (Default-Shell).
  # KAN-46: Paket-Build und Smoke-Test (PR und main, AC2); auf main zusätzlich Zip + .sha256 als Artefakt (AC1).
  # KAN-35 ergänzt den Dienst-Installationstest.
  # Bewusst nur `contents: read` (Workflow-Ebene) – die Provenance-Attestation mit `id-token: write` läuft im
  # separaten Job `windows-attest`, nur bei Push auf main.
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Mindest-Coverage aus der Repo-Variable; nie senken.
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '80' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv und Python 3.12 einrichten
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Abhängigkeiten installieren
        run: uv sync --locked --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format prüfen (ruff format)
        run: uv run ruff format --check .

      - name: Tests mit Coverage
        run: uv run pytest --cov=network_sniffer --cov-report=term-missing --cov-report=xml --cov-fail-under="$env:COVERAGE_MIN"

      - name: Build
        run: uv build

      # Paket bauen (KAN-46): Lizenz-Allowlist, PyInstaller onedir, Bundle-/Versionsprüfung,
      # dist/network-sniffer-<version>-windows-x64.zip + .zip.sha256. Exit 1 bei jedem Verstoß.
      - name: Windows-Paket bauen
        run: uv run python packaging/build_windows.py

      - name: Paketpfad ermitteln
        id: package
        run: |
          $zips = @(Get-ChildItem -Path dist -Filter 'network-sniffer-*-windows-x64.zip')
          if ($zips.Count -ne 1) { throw "Erwartet genau ein Paket in dist/, gefunden: $($zips.Count)" }
          "zip=$($zips[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Smoke-Test ohne Python: Prüfsumme, Entpacken, --version, serve + /api/health (AC2, AC4).
      - name: Smoke-Test des Pakets
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke_test.ps1 -ZipPath "$env:ZIP_PATH"

      # Nur auf main: Zip + Prüfsumme als Workflow-Artefakt (AC1). Der Upload braucht keine zusätzlichen Permissions.
      - name: Paket als Artefakt hochladen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: |
            dist/network-sniffer-*-windows-x64.zip
            dist/network-sniffer-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # Build-Provenance für das main-Artefakt (Sigstore über GitHub-OIDC). Eigener Job, damit `id-token: write` und
  # `attestations: write` nur hier und nur bei Push auf main vergeben werden. Kein Required Check.
  windows-attest:
    needs: windows-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Paket-Artefakt laden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: package

      - name: Prüfsumme verifizieren
        working-directory: package
        run: sha256sum --check --strict network-sniffer-*-windows-x64.zip.sha256

      - name: Build-Provenance attestieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/network-sniffer-*-windows-x64.zip
