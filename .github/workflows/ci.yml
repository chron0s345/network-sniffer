name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-Name ist Required Check der Branch-Protection – nicht umbenennen.
  # Befehle exakt wie in CLAUDE.md (Abschnitt "Befehle"), je Befehl ein Schritt.
  # Gleiche Schritte laufen unter Windows im Job `windows-build` (windows.yml) – beide synchron halten.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Mindest-Coverage aus der Repo-Variable; nie senken.
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '80' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv und Python 3.12 einrichten
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Abhängigkeiten installieren
        run: uv sync --locked --all-extras

      # KAN-46/ADR 0003: Lizenzen aller Laufzeit-Distributionen gegen die Allowlist – früh, damit ein
      # (L)GPL-Neuzugang im uv.lock-Diff sofort auffällt. Exit 1 bei Verstoß. Der Windows-Paket-Build prüft erneut.
      - name: Lizenz-Allowlist prüfen
        run: uv run python packaging/build_windows.py --check-licenses

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format prüfen (ruff format)
        run: uv run ruff format --check .

      - name: Tests mit Coverage
        run: uv run pytest --cov=network_sniffer --cov-report=term-missing --cov-report=xml --cov-fail-under="$COVERAGE_MIN"

      - name: Build
        run: uv build
