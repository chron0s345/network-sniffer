name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  # Job-Namen sind Required Checks der Branch-Protection – nicht umbenennen, kein continue-on-error.

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/default --config p/secrets --error --metrics off

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Trivy >= 0.59.0 liest uv.lock (Changelog 0.59.0: "python: add support for uv", #8080);
      # 0.58.1 war für Python blind. Image per Digest gepinnt (Schutz vor umgetaggten Images).
      # --include-dev-deps: auch Dev-/Optional-Abhängigkeiten (laufen in der CI) werden geprüft.
      - name: Trivy (Abhängigkeiten & Fehlkonfigurationen)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283
        run: |
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache/trivy -w /src "$TRIVY_IMAGE" fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --include-dev-deps \
            --skip-version-check \
            --exit-code 1 \
            .
      # Nachweis, dass der Scan die gelockten Python-Pakete sieht: SBOM aus demselben Scanner,
      # der Job schlägt fehl, wenn aus uv.lock keine Pakete erkannt werden (Schutz gegen erneute Blindheit).
      - name: Nachweis – Python-Pakete aus uv.lock erkannt
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283
        run: |
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache/trivy -w /src "$TRIVY_IMAGE" fs \
            --format cyclonedx \
            --include-dev-deps \
            --skip-version-check \
            --output /src/sbom.cdx.json \
            .
          found=$(jq '[.components[]? | select((.purl // "") | startswith("pkg:pypi/"))] | length' sbom.cdx.json)
          locked=$(grep -c '^\[\[package\]\]' uv.lock)
          echo "Pakete in uv.lock: $locked – von Trivy erkannte PyPI-Pakete: $found"
          jq -r '.components[]? | select((.purl // "") | startswith("pkg:pypi/")) | .purl' sbom.cdx.json | sort
          if [ "$found" -eq 0 ]; then
            echo "::error::Trivy hat keine Python-Pakete aus uv.lock erkannt – der dependencies-Scan wäre blind."
            exit 1
          fi
